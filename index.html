<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORENCIO MENDOZA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>ORENCIO MENDOZA</h1>

    <div id="alphabetNav" class="alphabet-nav"></div>

    <div id="topPanel">

        <div class="panel-buttons">
            <button id="exportBtn">Export</button>
            <button id="importBtn">Import</button>
            <button id="copyBtn">Copy List</button>
            <button id="clearBtn">Clear All</button>
        </div>

        <textarea id="output" readonly placeholder="Your list shows here"></textarea>

    </div>

    <div id="itemsContainer"></div>

    <div id="toast"></div>

    <div id="modal">
        <div class="modal-box">
            <div id="modalTitle" class="modal-title"></div>
            <textarea id="modalText"></textarea>
            <div class="modal-buttons">
                <button id="modalCancel">Cancel</button>
                <button id="modalOk">OK</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
