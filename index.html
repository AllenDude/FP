<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORENCIO MENDOZA</title>
    <meta name="theme-color" content="#2563eb">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="FP Orders">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>ORENCIO MENDOZA</h1>

    <div id="alphabetNav" class="alphabet-nav"></div>

    <div id="topPanel">

        <div class="panel-buttons">
            <button id="exportBtn">Copy Code</button>
            <button id="importBtn">Import Code</button>
            <button id="copyBtn">Copy List</button>
            <button id="clearBtn">Clear List</button>
        </div>

        <textarea id="output" readonly placeholder="Your list shows here"></textarea>

    </div>

    <div id="itemsContainer"></div>

    <div id="toast"></div>

    <div id="modal">
        <div class="modal-box">
            <div id="modalTitle" class="modal-title"></div>
            <textarea id="modalText"></textarea>
            <div class="modal-buttons">
                <button id="modalCancel">Cancel</button>
                <button id="modalOk">OK</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

    <script>
        // Lets the app install and open offline
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("sw.js").catch(() => {});
            });
        }
    </script>

</body>
</html>
